# Where each photo in content/photos/ comes from, and how it is cropped.
# The originals stay in _photos/inbox/ on Bilal's laptop and are never committed.
# After adding or changing an entry, run: pnpm photos
#
#   photo:  the file made in content/photos/
#   from:   the original in _photos/inbox/
#   ratio:  the shape: 4:5 (portrait), 1:1 (square) or 3:2 (landscape)
#   focus:  the point to keep at the centre, as fractions across and down (0 to 1)
#   zoom:   1 is the largest crop the photo allows; 1.25 comes a quarter closer

